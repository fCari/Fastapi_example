
name: Publish and Deploy FastAPI

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: tests
    runs-on: ubuntu-latest
    environment: lab-env

    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable release image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: test/fredy
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -f Dockerfile.prod -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE_URI"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: lab-env

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} #secrets.AWS_ECS_DEPLOY_ROLE_ARN
          aws-region: us-east-1

      - name: Render ECS task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: fastapi-task
          container-name: fastapi
          image: ${{ needs.publish.outputs.image_uri }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: fastapi-service
          cluster: fastapi-cluster
          wait-for-service-stability: true
          wait-max-delay-seconds: 15