name: Deploy FastAPI to EC2

on:
  workflow_run:
    workflows: ["Publish FastAPI Image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      }}

    runs-on: ubuntu-latest
    environment: lab-env

    concurrency:
      group: fastapi-ec2-deploy
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy FastAPI using SSM
        env:
          EC2_INSTANCE_ID: i-0f13fe3124688e843
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          AWS_REGION: us-east-1
        run: |
          #i-0a5374e1937020bed
          set -euo pipefail

          # Validate the image tag
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || exit 1

          # Build the exact image URI published by ECR
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/test/fredy:$IMAGE_TAG"

          echo "Deploying image: $IMAGE_URI"

          # Execute deploy.sh as the ubuntu user
          REMOTE_COMMAND="sudo -H -u ubuntu /bin/bash -lc 'IMAGE_URI=$IMAGE_URI /opt/fastapi-example/deploy.sh'"

          PARAMS=$(jq -nc \
            --arg cmd "$REMOTE_COMMAND" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the EC2 deployment to finish
          for attempt in $(seq 1 120); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$STATUS" in

              Success)
                echo "Deployment successful"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "Deployment failed"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}'

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timeout waiting for deployment"
          exit 1