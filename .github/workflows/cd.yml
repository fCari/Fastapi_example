name: CD Ubuntu
# El servidor ejecuta Python + Uvicorn mediante systemd.

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-ubuntu
  cancel-in-progress: false

jobs:
  deploy:
#    if: >-
#      github.event.workflow_run.conclusion == 'success' &&
#      github.event.workflow_run.event == 'push' &&
#      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: lab-env
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    steps:
      - name: Descargar el commit que pasó CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Subir el código
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            app/ "$SERVER_USER@$SERVER_HOST:/opt/users-api/app/"
          scp -i ~/.ssh/deploy_key \
            requirements.txt \
            "$SERVER_USER@$SERVER_HOST:/opt/users-api/requirements.txt"

      - name: Instalar y reiniciar
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/users-api
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          .venv/bin/pip install -r requirements.txt
          sudo -n /usr/bin/systemctl restart users-api.service
          curl --fail --silent --show-error --retry 15 --retry-delay 1 \
            --retry-all-errors --max-time 2 http://127.0.0.1:8000/health
          REMOTE

      - name: Limpiar clave SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
