name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: users_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d users_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The integration tests intentionally require /users_test and Redis DB 15.
      DATABASE_URL: postgresql://ci_user:ci_test_password@127.0.0.1:5432/users_test
      REDIS_URL: redis://127.0.0.1:6379/15
      CACHE_KEY: ci:users:all

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Run unit and integration tests
        run: python -m pytest -q

      - name: Validate production Docker build (no registry push)
        run: docker build -f Dockerfile.prod -t users-api:ci .