name: Publish FastAPI Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  # Reuse the exact CI workflow. Nothing is published if it fails.
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: tests
    runs-on: ubuntu-latest
    environment: lab-env
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable release image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: tecpsup/alumno_fready
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -f Dockerfile.prod -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "Published $IMAGE_URI"